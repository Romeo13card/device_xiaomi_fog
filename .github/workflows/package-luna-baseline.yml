name: Package Luna baseline device tree

on:
  push:
    branches:
      - prepared/luna-16.2-balanced-power

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean luna-16.2 baseline
        uses: actions/checkout@v4
        with:
          ref: luna-16.2
          path: source

      - name: Prepare Android source tree layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/device/xiaomi/fog
          rsync -a --delete --exclude='.git' source/ package/device/xiaomi/fog/
          test -f package/device/xiaomi/fog/AndroidProducts.mk
          test -f package/device/xiaomi/fog/BoardConfig.mk
          test -f package/device/xiaomi/fog/device.mk
          test -f package/device/xiaomi/fog/lineage_fog.mk

      - name: Upload baseline tree
        uses: actions/upload-artifact@v4
        with:
          name: device-xiaomi-fog-luna-16.2-baseline
          path: package/
          if-no-files-found: error
          retention-days: 1
